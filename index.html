  <body class="bg-[#020617] text-white min-h-screen overflow-x-hidden">
    <style>
      #app-fallback { display:flex; align-items:center; justify-content:center; height:100vh; color:#9CA3AF; font-family: 'Plus Jakarta Sans', sans-serif }
      #error-output { max-width:1100px; margin-top:18px; background:rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.04); padding:12px; border-radius:12px; color:#F87171; font-size:13px; white-space:pre-wrap }
    </style>
    <div id="root">
      <div id="app-fallback">
        <div>
          <div style="font-size:18px; font-weight:700;">Cargando la aplicación...</div>
          <div id="error-output" style="display:none">Si aparece un error se mostrará aquí.</div>
        </div>
      </div>
    </div>

    <script>
      // Mostrar errores de JS en la página para depuración cuando React falle
      function showError(msg) {
        try {
          const out = document.getElementById('error-output')
          out.style.display = 'block'
          out.textContent = typeof msg === 'string' ? msg : (msg && msg.stack) ? msg.stack : JSON.stringify(msg)
          // también loguear en consola
          console.error('App error:', msg)
        } catch (e) { console.error(e) }
      }

      window.addEventListener('error', function (e) {
        showError(e.error || e.message || String(e))
      })
      window.addEventListener('unhandledrejection', function (e) {
        showError(e.reason || String(e))
      })
    </script>

  </body>
